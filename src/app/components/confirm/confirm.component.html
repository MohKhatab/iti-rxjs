<dialog #modal id="my_modal_1" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Confirm</h3>
    <p class="py-4">{{ message }}</p>
    <div class="modal-action">
      <button class="btn btn-success" (click)="respond(true)">Yes</button>
      <button class="btn btn-error" (click)="respond(false)">No</button>
    </div>
  </div>
</dialog>
